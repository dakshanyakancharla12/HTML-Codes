<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid rgb(239, 32, 32);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(35, 4, 4);
            color: white;
        }
    </style>

</head>

<body>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>Java</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Anita</td>
                <td>Python</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Arun</td>
                <td>Web Development</td>
                <td>78</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Priya</td>
                <td>Java</td>
                <td>88</td>
            </tr>

            <tr>
                <td>105</td>
                <td>Kiran</td>
                <td>Python</td>
                <td>76</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Average</td>
                <td>83.4</td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
